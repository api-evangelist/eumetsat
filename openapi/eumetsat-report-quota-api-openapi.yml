        workspace_dir_size:
          type: number
        log_dir_size:
          type: number
        output_dir_size:
          type: number
        nr_customisations:
          type: number
      description: Report of user space occupation. Only works with valid input user-folder path.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    default:
