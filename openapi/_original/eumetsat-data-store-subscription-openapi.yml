swagger: '2.0'
info:
  description: Data-Store Subscription API
  version: 0.0.1
  title: DS_Subscription_API
  termsOfService: http://www.eumetsat.int/terms/
  contact:
    name: CGI EOSS
    url: https://cgi.com/
    email: address@cgi.com
  license:
    name: 'License: not yet defined. For the time being: confidential and private'
    url: http://www.eumetsat.int
host: api.eumetsat.int
basePath: /data/subscribe/0.0.1
tags:
- name: subscription-controller
  description: Subscription Controller
schemes:
- https
- http
security:
- default: []
paths:
  /subscription:
    get:
      tags:
      - subscription-controller
      summary: Retrieve the user subscriptions.
      operationId: retrieveSubscriptionsUsingGET
      produces:
      - '*/*'
      parameters: []
      responses:
        '200':
          description: Subscriptions found
          schema:
            type: array
            items:
              $ref: '#/definitions/SubscriptionFilterDto'
      security:
      - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
    post:
      tags:
      - subscription-controller
      summary: Create a new subscription.
      operationId: createNewSubscriptionUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - in: body
        name: filterDto
        description: filterDto
        required: true
        schema:
          $ref: '#/definitions/SubscriptionFilterDto'
      responses:
        '201':
          description: Subscription created
          schema:
            type: string
        '400':
          description: Bad request - client responsibility
        '500':
          description: Subscription api internal error
      security:
      - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
  /subscription/{subscriptionId}:
    get:
      tags:
      - subscription-controller
      summary: Retrieve a subscription.
      operationId: retrieveSubscriptionUsingGET
      produces:
      - '*/*'
      parameters:
      - name: subscriptionId
        in: path
        description: subscriptionId
        required: true
        type: string
      responses:
        '200':
          description: Subscription found
          schema:
            $ref: '#/definitions/SubscriptionFilterDto'
        '404':
          description: Not found
      security:
      - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
    delete:
      tags:
      - subscription-controller
      summary: Delete a subscription.
      operationId: deleteSubscriptionUsingDELETE
      produces:
      - '*/*'
      parameters:
      - name: subscriptionId
        in: path
        description: subscriptionId
        required: true
        type: string
      responses:
        '200':
          description: OK
          schema:
            type: string
        '202':
          description: Subscription cancelled
          schema:
            type: string
        '404':
          description: Not found
      security:
      - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
