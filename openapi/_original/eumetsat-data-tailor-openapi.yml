    delete:
      description: Deletes information on the customisation corresponding to the given Uuid identifier.
      operationId: DELETE_customisations-customisationId
      parameters:
      - name: customisationId
        in: path
        description: 8-digit alphanumeric customisation ID (e.g. a638f29l).
