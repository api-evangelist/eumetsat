          type: integer
          default: 1000
      - name: offset
        in: query
        description: directory sub-levels shown
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
