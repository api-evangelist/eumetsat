# x-archived-from: eumetsat-data-tailor-openapi.yml
# x-archived-on: 2026-10-18
openapi: 3.0.1
info:
  title: Data Tailor Web Service (DTWS)
  description: The DTWS is a service based on EUMETSAT Data Tailor, hosted in the EUMETSAT Cloud. It provides customisation services to external users and to other services in the Cloud, notably the Data Store. This is its Web API for application-to-application usage, based on a REST design.
  version: 0.1.0
servers:
- url: https://api.eumetsat.int/epcs/0.1.0
- url: http://api.eumetsat.int/epcs/0.1.0
security:
- default: []
paths:
  /info:
    get:
      description: Returns general information about the Data Tailor configuration in its currently installed version.
      operationId: GET_info
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /user_info:
    get:
      description: Returns information about the configuration for user with user_id identifier.
      operationId: GET_user_info
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_info'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /report_quota:
    get:
      description: Provides a report of user space occupation. The information returned includes (a) the current user quota; (b) the space occupied by the user folder; (c) the percentage of space occupied by the user folder with respect to the set quota; (d) user workspace directory size; (e) user log directory size; (f) output directory size. The user can choose the units this information will be displayed in.
      operationId: GET_report_quota
      parameters:
      - name: unit_size
        in: query
        description: The report will express sizes in the chosen units. Defaults to 'GB', can be set to either 'B', 'MB' and 'GB'.
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportQuota'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /customisations:
    get:
      description: Retrieves information on the customisations corresponding to the given list of Uuid identifiers.
      operationId: GET_customisations
      parameters:
      - name: user_id
        in: query
        description: Only return the customisations executed by the corresponding user.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: backend
        in: query
        description: Only show customisations with backend of given ID.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: product
        in: query
        description: Only show customisations with input product of given product ID.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: Only show customisations in given status.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: return_size
        in: query
        description: Also return disk size occupied by customisation products and logs.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: start_time
        in: query
        description: Only show customisations starting at given time.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: stop_time
        in: query
        description: Only show customisations ending at given time
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: today
        in: query
        description: Only show customisations which were run today
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: step
        in: query
        description: Only show customisations which included the given step
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: maximum number of results returned
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1000
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customisation'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
    post:
      description: Launches a customisation with the given chain configuration. If successful, returns a corresponding Uuid identifier.
      operationId: POST_customisations
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - product_paths
              properties:
                shapefile_stream:
                  type: string
                  description: Shapefile describing a Region of Interest (ROI).
                  format: binary
                product_paths:
                  type: string
                  description: list of product paths separated by |||.
                chain_config:
                  type: string
                  description: Serialised JSON representation of the configuration of a customisation chain.
                basket_config:
                  type: string
                  description: Serialised JSON representation of a Data Store Basket.
                chain_name:
                  type: string
                  description: Key name of an existing functional chain.
                sensing_start:
                  type: string
                  description: Desired sensing start time (YYYYMMDDThhmmssZ).
                sensing_stop:
                  type: string
                  description: Desired sensing stop time (YYYYMMDDThhmmssZ).
        required: true
      responses:
        '200':
          description: customisation identifier (uuid)
          content: {}
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
    delete:
      description: Deletes all information pertaining to the customisations corresponding to the given list of Uuid identifiers.
      operationId: DELETE_customisations
      responses:
        default:
          content: {}
      security:
      - default: []
      x-codegen-request-body-name: body
      x-auth-type: Application & Application User
      x-throttling-tier: null
  /customisations/delete:
    patch:
      description: Patch API method to delete output products and logs of customisations corresponding to the given list of Uuid identifiers.
      operationId: PATCH_customisations_delete
      requestBody:
        description: list of customisation IDs of which products and logs will be deleted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Uuids'
          form/multipart:
