      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuicklookStretchMethod'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /resample_methods:
    get:
      description: Returns the list of available resampling methods for the customisation of a given product into a given output format.
      operationId: GET_resample_methods
      parameters:
      - name: product
        in: query
        description: Only return resample methods supported for given input product type
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: Only return resample methods supported for given output format
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResampleMethod'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /stretch_methods:
    get:
      description: Returns the list of available stretch methods, if any.
      operationId: GET_stretch_methods
      parameters:
      - name: product
        in: query
        description: Only return stretch methods supported for given product
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: Only return stretch methods supported for given format
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StretchMethod'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /aggregation_analyse:
    post:
      description: Shows the result of the aggregation analysis for a given product and for the chosen input files.
      operationId: POST_aggregation_analyse
      requestBody:
        description: Only show results with given status.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Status'
          form/multipart:
            schema:
              $ref: '#/components/schemas/Status'
        required: true
      responses:
        default:
          content: {}
      security:
      - default: []
      x-codegen-request-body-name: body
      x-auth-type: Application & Application User
      x-throttling-tier: null
  /compressions:
    get:
      description: Returns the list of available compressed formats for output files.
      operationId: GET_compressions
      parameters:
      - name: product
        in: query
        description: Only return compressions available for given product
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: Only return compressions available for given format
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Compression'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /features:
    get:
      description: Retrieves the list of supported customisation functions (excluding re-format).
      operationId: GET_features
      parameters:
      - name: product
        in: query
        description: Only return features corresponding to given product
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: Only return features corresponding to given format
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /backends:
    get:
      description: Retrieves the list of available backends.
      operationId: GET_backends
      parameters:
      - name: format
        in: query
        description: Only return backends relevant to given format
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: product
        in: query
        description: Only return backends relevant to given product
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Backend'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
  /backends/{backendId}:
    get:
      description: Retrieves information on the available backend with given backendId identifier.
      operationId: GET_backends-backendId
      parameters:
      - name: backendId
        in: path
        description: Registered backend ID (e.g. epct_plugin_gis).
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
components:
  schemas:
    Info:
      required:
      - epct_version
      - installed_plugins
      - registered_backends
      type: object
      properties:
        epct_version:
          type: string
          example: 3.0.0
        installed_plugins:
          type: array
          items:
            type: string
            example: epct-plugin-gis, 3.0.0
        registered_backends:
          type: array
          items:
            type: string
      description: General information about the Data Tailor configuration.
    User_info:
      required:
      - config
      - etc_dir
      - user_id
      type: object
      properties:
        user_id:
          type: string
          example: data_tailor
        etc_dir:
          type: string
          example: /home/data_tailor/miniconda3/envs/my_env/etc/epct
        config:
          type: array
          items:
            type: string
      description: Information about the configuration for user of ID user_id.
    Status:
      type: object
      properties:
        status:
          type: string
      description: Status of the customisation.
    ReportQuota:
      required:
      - log_dir_size
      - output_dir_size
      - space_usage
      - space_user_percentage
      - user_quota
      - workspace_dir_size
      type: object
      properties:
        user_quota:
          type: number
        space_user_percentage:
          type: number
        space_usage:
          type: number
        workspace_dir_size:
          type: number
        log_dir_size:
          type: number
        output_dir_size:
          type: number
        nr_customisations:
          type: number
          example: 1
      description: Report of user space occupation. Only works with valid input user-folder path.
    Customisation:
      required:
      - backend_id
      - creation_time
      - id
      - product_id
      - status
      - user_id
      type: object
      properties:
        user_id:
          type: string
          example: john
        creation_time:
          type: string
          example: 20220518T084016Z
        backend_id:
          type: string
          example: epct_eps_native
        product_id:
          type: string
          example: AMSAL1
        required_processing_steps:
          type: array
          items:
            type: string
            example: format
        processing_duration:
          type: integer
        status:
          type: string
          example: KILLED
        id:
          type: string
          example: 3f94e79d
      description: List of customisations
    DirEntry:
      required:
      - is_dir
      - path
      type: object
      properties:
        path:
          type: string
        is_dir:
          type: boolean
        st_size:
          type: integer
        st_mtime:
          type: number
      description: List files in directory.
      example:
        path: ./README.txt
        is_dir: false
        st_size: 345
        st_mtime: 1560168369.1
    Product:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: MSGFIRG
        name:
          type: string
          example: Active Fire Monitoring (GRIB) - MSG
        description:
          type: string
          example: Fire detector indicator
        bands:
          type: object
          properties: {}
          example: fire_detection_indicator
        pn_id:
          type: string
          example: EO:EUM:DAT:MSG:FIR
      description: List of supported input product types.
      example:
        id: MSGFIRG
        name: Active Fire Monitoring (GRIB) - MSG
        bands:
          fire_detection_indicator:
            name: Fire detection indicator
            number: 1
        pn_id:
        - EO:EUM:DAT:MSG:FIR
        - EO:EUM:DAT:MSG:FIR-IODC
    Body_Selection:
      required:
      - body_selection
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: body_selection_1
        name:
          type: string
          example: Body Selection 1
        description:
          type: string
          example: Body segments selection
        body_selection:
          type: array
          example: '[1,2,4,7]'
        product:
          type: string
          example: FCIL1FDHSI
      description: Body segments selection
    Chain:
      required:
      - format
      - id
      - name
      - product
      type: object
      properties:
        id:
          type: string
          example: sst_western_europe
        name:
          type: string
          example: SST - Western Europe
        description:
          type: string
          example: Sea Surface Temperature band with ROI over Western Europe and geographic projection
        product:
          type: string
          example: GLBSST
        format:
          type: string
          example: geotiff
        aggregation:
          type: string
        projection:
          type: string
          example: geographic
        roi:
          $ref: '#/components/schemas/Roi'
        filter:
          $ref: '#/components/schemas/Filter'
      description: Configurations of customisation processes.
    Roi:
      required:
      - NSWE
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: western_europe
        name:
          type: string
          example: Western Europe
        NSWE:
          type: array
          items:
            type: number
        description:
          type: string
      description: List of available pre-configured Regions Of Interest (ROIs).
    Format:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ext:
          type: string
        description:
          type: string
      description: List of supported output formats.
      example:
        id: jpeg_rgb
        name: JPEG (RGB)
        ext: .jpg
        description: JPEG files are represented as three band (RGB) datasets with Byte valued bands.
    Filter:
      required:
      - bands
      - id
      - name
      - product
      type: object
      properties:
        product:
          type: string
          example: AVHRRL1
        bands:
          type: array
          items:
            $ref: '#/components/schemas/Band'
        id:
          type: string
          example: avhrrl1_natural_color
        name:
          type: string
          example: Natural Color
      description: List of available filters per product.
    Band:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: channel_1
        name:
          type: string
          example: Channel 1
        description:
          type: string
      description: List of bands.
    Aggregation:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: orbit
        name:
          type: string
          example: Orbit
        description:
          type: string
          example: Aggregate entire orbit
      description: List of supported aggregation types, if any.
    Projection:
      required:
      - id
      - name
      - unit
      type: object
      properties:
        id:
          type: string
          example: mollweide
        name:
          type: string
          example: Mollweide
        unit:
          type: string
          example: meter
        description:
          type: string
          example: The Mollweide projection is an equal-area, pseudo-cylindrical map projection generally used for global maps of the world or night sky
      description: List of available projections.
    Quicklook:
      required:
      - filter
      - format
      - id
      - name
      - product
      - resample_method
      - stretch_method
      type: object
      properties:
        id:
          type: string
          example: hrseviri_png
        name:
          type: string
          example: PNG size 100% - keep aspect ratio
        resample_method:
          type: string
          example: cubic
        stretch_method:
          type: string
          example: min_max
        product:
          type: string
          example: HRSEVIRI
        format:
          type: string
          example: png_rgb
        nodatacolor:
          type: string
          example: transparent
        filter:
          type: object
          properties: {}
          example: hrseviri_natural_color
      description: Pre-configured quicklook configurations.
    QuicklookFormat:
      required:
      - ext
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: jpeg_rgb
        name:
          type: string
          example: JPEG (RGB)
        comment:
          type: string
          example: JPEG files are represented as three band (RGB) datasets with Byte valued bands.
        ext:
          type: string
          example: .jpg
      description: List of supported output formats for quicklook, if any.
    QuicklookNodatacolor:
      required:
      - id
      - name
      - value
      type: object
      properties:
        id:
          type: string
          example: white
        name:
          type: string
          example: white
        description:
          type: string
          example: Nodata values are plotted in white color in the quick-look
        value:
          type: array
          items:
            type: integer
      description: List of supported colours to express <no data> in quicklook, if any.
    QuicklookResampleMethod:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: bilinear
        name:
          type: string
          example: Bilinear resampling
      description: List of supported resampling methods applicable to quicklooks, if any.
    QuicklookStretchMethod:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: min_max
        name:
          type: string
          example: Min - Max
        description:
          type: string
          example: Stretch between minimum and maximum values
      description: List of supported stretch methods applicable to quicklooks, if any.
    ResampleMethod:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: bilinear
        name:
          type: string
          example: Bilinear resampling
      description: List of available resampling methods, if any.
    StretchMethod:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: min_max
        name:
          type: string
          example: Min - Max
        description:
          type: string
          example: Stretch between minimum and maximum values
      description: List of available stretch methods, if any.
    Log:
      required:
      - log_content
      type: object
      properties:
        log_content:
          type: string
      description: Customisation log file.
    Compression:
      required:
      - archiver
      - description
      - ext
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: zip
        name:
          type: string
          example: Zip
        description:
          type: string
          example: Archive file compressed using zip algorithm.
        ext:
          type: string
          example: .zip
        archiver:
          type: string
          example: zip
      description: List of available types of output files compression.
    Feature:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          example: aggregation
      description: List of supported customisation functions (excluding re-format).
    Backend:
      required:
      - aggregations
      - execute
      - features
      - formats
      - id
      - name
      - products
      - projections
      - quicklook_formats
      - quicklook_nodatacolors
      - quicklook_resample_methods
      - quicklook_stretch_methods
      type: object
      properties:
        id:
          type: string
          example: epct_plugin_umarf_openmtp
        name:
          type: string
          example: epct_plugin_umarf_openmtp
        products:
          type: array
          items:
            type: string
            example: MVIRI
        formats:
          type: array
          items:
            type: string
            example: open_mtp
        features:
          type: array
          items:
            type: string
            example: filter
        projections:
          type: array
          items:
            type: string
            example: mollweide
        aggregations:
          type: array
          items:
            type: string
            example: disk
        quicklook_formats:
          type: array
          items:
            type: string
            example: jpeg_rgb
        quicklook_nodatacolors:
          type: array
          items:
            type: string
            example: black
        quicklook_stretch_methods:
          type: array
          items:
            type: string
            example: min_max
        quicklook_resample_methods:
          type: array
          items:
            type: string
            example: bilinear
        execute:
          type: string
          example: epct_plugin_umarf.executable:run
      description: List of available backends.
    Basket:
      required:
      - basket
      type: object
      properties:
        basket:
          type: string
      description: XML Basket from Data Store
      example:
        basket: <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><metalink xmlns=\"urn:ietf:params:xml:ns:metalink\"><file name=""></file></metalink>
    Error:
      required:
      - message
      type: object
      properties:
        message:
          type: string
      description: Error messages.
      example:
        message: path not found or not accessible
    Uuids:
      required:
      - uuids
      type: object
      properties:
        uuids:
          type: array
          items:
            type: string
        description:
          type: string
      description: List of customisation uuids.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://api.eumetsat.int/authorize
          scopes: {}
