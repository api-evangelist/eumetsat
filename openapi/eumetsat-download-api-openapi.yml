openapi: 3.2.0
info:
  title: Eumetsat Download API
  version: '1.0'
  description: 'Operations tagged Download across 7 of this provider''s published API definitions: eumetsat-data-store-download-openapi.json, eumetsat-data-tailor-openapi.json, eumetsat-product-navigator-csw-openapi.json, eumetsat-data-store-download-openapi.yml, eumetsat-data-tailor-openapi.yml, eumetsat-dtws-openapi.yml, eumetsat-product-navigator-csw-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.eumetsat.int/data/download/1.0.0
- url: http://api.eumetsat.int/data/download/1.0.0
- url: https://api.eumetsat.int/epcs/0.1.0
- url: http://api.eumetsat.int/epcs/0.1.0
- url: https://api.eumetsat.int/elastic-csw/1.0.0
- url: http://api.eumetsat.int/elastic-csw/1.0.0
- url: https://api.eumetsat.int/dtws/1.0.0
- url: http://api.eumetsat.int/dtws/1.0.0
security:
- default: []
tags:
- name: Download
  description: Download EUMETSAT Online EO Data.
  externalDocs:
    description: Find out more
    url: http://www.eumetsat.int
paths:
  /collections/{collID}/products/{prodID}:
    get:
      tags:
      - Download
      summary: Download product as compressed SIP
      description: Downloads the product as compressed SIP
      operationId: downloadProductByID
      parameters:
      - name: collID
        in: path
        description: collection ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: prodID
        in: path
        description: The ID of the product to download
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation. The response is a representation of the product.
          content: {}
        '400':
          description: The client request has errors.
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: The client is not authorized to access the requested resource.
          content: {}
        '404':
          description: The requested resource was not found.
          content: {}
        '405':
          description: The HTTP method specified in the request is not allowed for this resource.
          content: {}
        '500':
          description: The Download API encountered an internal error that was not foreseen, e.g. because a backend service is down. Error details will be contained in the log files and not be returned to the client.
          content: {}
      security:
      - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
    servers:
    - url: https://api.eumetsat.int/data/download/1.0.0
    - url: http://api.eumetsat.int/data/download/1.0.0
