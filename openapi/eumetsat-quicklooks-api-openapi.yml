openapi: 3.2.0
info:
  title: Eumetsat Quicklooks API
  version: '1.0'
  description: 'Operations tagged Quicklooks across 3 of this provider''s published API definitions: eumetsat-data-tailor-openapi.json, eumetsat-data-tailor-openapi.yml, eumetsat-dtws-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.eumetsat.int/epcs/0.1.0
- url: http://api.eumetsat.int/epcs/0.1.0
- url: https://api.eumetsat.int/dtws/1.0.0
- url: http://api.eumetsat.int/dtws/1.0.0
security:
- default: []
tags:
- name: Quicklooks
paths:
  /quicklooks:
    get:
      description: Retrieves the list of available pre-configured quicklook configurations.
      operationId: GET_quicklooks
      parameters:
      - name: product
        in: query
        description: Only retrieve results supported for given input product type
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: Only retrieve results supported for given output format
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quicklook'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Quicklooks
      summary: GET quicklooks
      x-summary-source: derived
    post:
      description: Allows users to configure custom quicklook outputs.
      operationId: POST_quicklooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quicklook'
          form/multipart:
            schema:
              $ref: '#/components/schemas/Quicklook'
        required: true
      responses:
        default:
          content: {}
      security:
      - default: []
      x-codegen-request-body-name: body
      x-auth-type: Application & Application User
      x-throttling-tier: null
      tags:
      - Quicklooks
      summary: POST quicklooks
      x-summary-source: derived
    servers:
    - url: https://api.eumetsat.int/epcs/0.1.0
    - url: http://api.eumetsat.int/epcs/0.1.0
  /quicklooks/{quicklookId}:
    get:
      description: Retrieves information on the available quicklook configuration with given quicklookId identifier.
      operationId: GET_quicklooks-quicklookId
      parameters:
      - name: quicklookId
        in: path
        description: Pre-configured quicklook configuration ID (e.g. avhrrl1_jpeg_rgb).
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quicklook'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Quicklooks
      summary: GET quicklooks quicklook id
      x-summary-source: derived
    put:
      description: Allows users to update the quicklook configuration with given quicklookId.
      operationId: PUT_quicklooks-quicklookId
      parameters:
      - name: quicklookId
        in: path
        description: Pre-configured quicklook configuration ID (e.g. avhrrl1_jpeg_rgb).
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quicklook'
          form/multipart:
            schema:
              $ref: '#/components/schemas/Quicklook'
        required: true
      responses:
        default:
          content: {}
      security:
      - default: []
      x-codegen-request-body-name: body
      x-auth-type: Application & Application User
      x-throttling-tier: null
      tags:
      - Quicklooks
      summary: PUT quicklooks quicklook id
      x-summary-source: derived
    delete:
      description: Allows users to delete the quicklook configuration with given quicklookId.
      operationId: DELETE_quicklooks-quicklookId
      parameters:
      - name: quicklookId
        in: path
        description: Pre-configured quicklook configuration ID (e.g. avhrrl1_jpeg_rgb).
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        default:
          content: {}
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Quicklooks
      summary: DELETE quicklooks quicklook id
      x-summary-source: derived
    servers:
    - url: https://api.eumetsat.int/epcs/0.1.0
    - url: http://api.eumetsat.int/epcs/0.1.0
components:
  schemas:
    Quicklook:
      required:
      - filter
      - format
      - id
      - name
      - product
      - resample_method
      - stretch_method
      type: object
      properties:
        id:
          type: string
          example: hrseviri_png
        name:
          type: string
          example: PNG size 100% - keep aspect ratio
        resample_method:
          type: string
          example: cubic
        stretch_method:
          type: string
          example: min_max
        product:
          type: string
          example: HRSEVIRI
        format:
          type: string
          example: png_rgb
        nodatacolor:
          type: string
          example: transparent
        filter:
          type: object
          properties: {}
          example: hrseviri_natural_color
      description: Pre-configured quicklook configurations.
    Quicklook_2:
      type: object
      required:
      - filter
      - format
      - id
      - name
      - product
      - resample_method
      - stretch_method
      properties:
        id:
          type: string
        name:
          type: string
        resample_method:
          type: string
        stretch_method:
          type: string
        product:
          type: string
        format:
          type: string
        nodatacolor:
          type: string
        filter:
          type: object
          properties: {}
      description: Pre-configured quicklook configurations.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://api.eumetsat.int/authorize
          scopes: {}
    Bearer:
      type: apiKey
      name: Authorization
      in: header
x-refined-from:
- eumetsat-data-tailor-openapi.json
- eumetsat-data-tailor-openapi.yml
- eumetsat-dtws-openapi.yml
