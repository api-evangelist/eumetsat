openapi: 3.2.0
info:
  title: Eumetsat Quicklook Stretch Methods API
  version: '1.0'
  description: 'Operations tagged Quicklook Stretch Methods across 3 of this provider''s published API definitions: eumetsat-data-tailor-openapi.json, eumetsat-data-tailor-openapi.yml, eumetsat-dtws-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.eumetsat.int/epcs/0.1.0
- url: http://api.eumetsat.int/epcs/0.1.0
- url: https://api.eumetsat.int/dtws/1.0.0
- url: http://api.eumetsat.int/dtws/1.0.0
security:
- default: []
tags:
- name: Quicklook Stretch Methods
paths:
  /quicklook_stretch_methods:
    get:
      description: Returns the list of supported stretch methods applicable to quicklook output images, if any.
      operationId: GET_quicklook_stretch_methods
      parameters:
      - name: format
        in: query
        description: Only return quicklook stretch methods supported for given output format
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: product
        in: query
        description: Only return quicklook stretch methods supported for given input product type
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuicklookStretchMethod'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Quicklook Stretch Methods
      summary: GET quicklook stretch methods
      x-summary-source: derived
    servers:
    - url: https://api.eumetsat.int/epcs/0.1.0
    - url: http://api.eumetsat.int/epcs/0.1.0
  /quicklook_stretch_methods/{stretch_methodId}:
    get:
      description: Returns the stretch method applicable to quicklook output images, corresponding to the given ID.
      operationId: GET_quicklook_stretch_methods-stretch_methodId
      parameters:
      - name: stretch_methodId
        in: path
        description: Pre-configured quicklook stretch method ID (e.g. min_max).
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuicklookStretchMethod'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Quicklook Stretch Methods
      summary: GET quicklook stretch methods stretch method id
      x-summary-source: derived
    servers:
    - url: https://api.eumetsat.int/epcs/0.1.0
    - url: http://api.eumetsat.int/epcs/0.1.0
components:
  schemas:
    QuicklookStretchMethod:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: min_max
        name:
          type: string
          example: Min - Max
        description:
          type: string
          example: Stretch between minimum and maximum values
      description: List of supported stretch methods applicable to quicklooks, if any.
    QuicklookStretchMethod_2:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      description: List of supported stretch methods applicable to quicklooks, if any.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://api.eumetsat.int/authorize
          scopes: {}
    Bearer:
      type: apiKey
      name: Authorization
      in: header
x-refined-from:
- eumetsat-data-tailor-openapi.json
- eumetsat-data-tailor-openapi.yml
- eumetsat-dtws-openapi.yml
