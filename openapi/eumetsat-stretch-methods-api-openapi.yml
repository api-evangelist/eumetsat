openapi: 3.2.0
info:
  title: Eumetsat Stretch Methods API
  version: '1.0'
  description: 'Operations tagged Stretch Methods across 3 of this provider''s published API definitions: eumetsat-data-tailor-openapi.json, eumetsat-data-tailor-openapi.yml, eumetsat-dtws-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.eumetsat.int/epcs/0.1.0
- url: http://api.eumetsat.int/epcs/0.1.0
- url: https://api.eumetsat.int/dtws/1.0.0
- url: http://api.eumetsat.int/dtws/1.0.0
security:
- default: []
tags:
- name: Stretch Methods
paths:
  /stretch_methods:
    get:
      description: Returns the list of available stretch methods, if any.
      operationId: GET_stretch_methods
      parameters:
      - name: product
        in: query
        description: Only return stretch methods supported for given product
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: Only return stretch methods supported for given format
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StretchMethod'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Stretch Methods
      summary: GET stretch methods
      x-summary-source: derived
    servers:
    - url: https://api.eumetsat.int/epcs/0.1.0
    - url: http://api.eumetsat.int/epcs/0.1.0
components:
  schemas:
    StretchMethod:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: min_max
        name:
          type: string
          example: Min - Max
        description:
          type: string
          example: Stretch between minimum and maximum values
      description: List of available stretch methods, if any.
    StretchMethod_2:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      description: List of available stretch methods, if any.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://api.eumetsat.int/authorize
          scopes: {}
    Bearer:
      type: apiKey
      name: Authorization
      in: header
x-refined-from:
- eumetsat-data-tailor-openapi.json
- eumetsat-data-tailor-openapi.yml
- eumetsat-dtws-openapi.yml
