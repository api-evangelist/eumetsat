openapi: 3.2.0
info:
  title: Eumetsat Aggregations API
  version: '1.0'
  description: 'Operations tagged Aggregations across 3 of this provider''s published API definitions: eumetsat-data-tailor-openapi.json, eumetsat-data-tailor-openapi.yml, eumetsat-dtws-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.eumetsat.int/epcs/0.1.0
- url: http://api.eumetsat.int/epcs/0.1.0
- url: https://api.eumetsat.int/dtws/1.0.0
- url: http://api.eumetsat.int/dtws/1.0.0
security:
- default: []
tags:
- name: Aggregations
paths:
  /aggregations:
    get:
      description: Returns the list of supported aggregation types for given backends, formats, products.
      operationId: GET_aggregations
      parameters:
      - name: backend
        in: query
        description: Only return results supported with given backend
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: Only return results supported with given output format
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: product
        in: query
        description: Only return results supported with given input product type
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Aggregation'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Aggregations
      summary: GET aggregations
      x-summary-source: derived
    servers:
    - url: https://api.eumetsat.int/epcs/0.1.0
    - url: http://api.eumetsat.int/epcs/0.1.0
components:
  schemas:
    Aggregation:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: orbit
        name:
          type: string
          example: Orbit
        description:
          type: string
          example: Aggregate entire orbit
      description: List of supported aggregation types, if any.
    Aggregation_2:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      description: List of supported aggregation types, if any.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://api.eumetsat.int/authorize
          scopes: {}
    Bearer:
      type: apiKey
      name: Authorization
      in: header
x-refined-from:
- eumetsat-data-tailor-openapi.json
- eumetsat-data-tailor-openapi.yml
- eumetsat-dtws-openapi.yml
