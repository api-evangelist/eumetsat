openapi: 3.2.0
info:
  title: Eumetsat Discovery API
  version: 1.0.0
  license:
    name: 'License: not yet defined. For the time being: confidential and private'
    url: https://www.eumetsat.int
  termsOfService: https://www.eumetsat.int/terms/
  description: 'Operations tagged Discovery across 2 of this provider''s published API definitions: eumetsat-data-store-browse-openapi.json, eumetsat-data-store-browse-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.eumetsat.int/data/browse/1.0.0
- url: http://api.eumetsat.int/data/browse/1.0.0
security:
- default: []
tags:
- name: Discovery
  description: Search and discover EUMETSAT Data.
  externalDocs:
    description: Find out more
    url: https://www.eumetsat.int
paths:
  /:
    get:
      tags:
      - Discovery
      summary: Show overview
      description: Provides the metadata for every Collection available in Data-Store in GeoJSON- or HTML-format depending on the requested format
      operationId: getOverview
      responses:
        '200':
          description: successful operation. Here only the reference to the GeoJSON response schema is given
          content: {}
        '400':
          description: The client request has errors.
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: The requested resource was not found.
          content: {}
        '405':
          description: The HTTP method specified in the request is not allowed for this resource.
          content: {}
        '500':
          description: The REST API encountered an internal error that was not foreseen, e.g. because a backend service is down. Error details will be contained in the log files and not be returned to the client.
          content: {}
      security:
      - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
    servers:
    - url: https://api.eumetsat.int/data/browse/1.0.0
    - url: http://api.eumetsat.int/data/browse/1.0.0
  /footprints/{sensorMode}/{subSatelliteLongitude}:
    get:
      tags:
      - Discovery
      summary: Returns the footprint for a GEO product
      description: GEO products do not have an individual footprint. Instead, this resource represents a GEO footprint for the respective sensor mode and sub satellite longitude.
      operationId: getFootprint
      parameters:
      - name: sensorMode
        in: path
        description: sensor mode
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - ALTHRV
          - REDSCN
          - NOMSCN
      - name: subSatelliteLongitude
        in: path
        description: sub satellite longitude
        required: true
        style: simple
        explode: false
        schema:
          type: number
      responses:
        '200':
          description: successful operation
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/Polygon'
        '400':
          description: The client request has errors.
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: The requested resource was not found.
          content: {}
        '405':
          description: The HTTP method specified in the request is not allowed for this resource.
          content: {}
        '500':
          description: The REST API encountered an internal error that was not foreseen, e.g. because a backend service is down. Error details will be contained in the log files and not be returned to the client.
          content: {}
      security:
      - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
    servers:
    - url: https://api.eumetsat.int/data/browse/1.0.0
    - url: http://api.eumetsat.int/data/browse/1.0.0
