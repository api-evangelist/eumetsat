openapi: 3.2.0
info:
  title: Eumetsat Body Selections API
  version: 0.1.0
  description: 'Operations tagged Body Selections across 2 of this provider''s published API definitions: eumetsat-data-tailor-openapi.json, eumetsat-data-tailor-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.eumetsat.int/epcs/0.1.0
- url: http://api.eumetsat.int/epcs/0.1.0
security:
- default: []
tags:
- name: Body Selections
paths:
  /body_selections:
    get:
      description: Retrieves information on existing body selection configurations.
      operationId: GET_body_selections
      parameters:
      - name: product
        in: query
        description: Only retrieve results supported for given input product type
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: format
        in: query
        description: Only retrieve results supported for given output format
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: Only return results starting from offset^th result
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        style: form
        explode: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                required:
                - data
                - total
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Body_Selection'
                example:
                  total: 1
                  data:
                  - id: body_selection_FDHSI_1
                    name: Body Selection 1
                    product: FDHSI
                    format: geotiff
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Body Selections
      summary: GET body selections
      x-summary-source: derived
    post:
      description: Allows the user to create new custom body selection configurations.
      operationId: POST_body_selections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Selection'
          form/multipart:
            schema:
              $ref: '#/components/schemas/Body_Selection'
        required: true
      responses:
        default:
          content: {}
      security:
      - default: []
      x-codegen-request-body-name: body
      x-auth-type: Application & Application User
      x-throttling-tier: null
      tags:
      - Body Selections
      summary: POST body selections
      x-summary-source: derived
    servers:
    - url: https://api.eumetsat.int/epcs/0.1.0
    - url: http://api.eumetsat.int/epcs/0.1.0
  /body_selections/{body_selectionId}:
    get:
      description: Retrieves information on the existing body selection configuration with given identifier.
      operationId: GET_body_selections-body_selectionId
      parameters:
      - name: body_selectionId
        in: path
        description: Pre-configured body_selection ID (e.g. body selection 1).
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: expanded
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Body_Selection'
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Body Selections
      summary: GET body selections body selection id
      x-summary-source: derived
    put:
      description: Updates existing customisation chain configuration with given body_selectionId identifier.
      operationId: PUT_body_selections-body_selectionId
      parameters:
      - name: body_selectionId
        in: path
        description: Pre-configured body_selection ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Selection'
          form/multipart:
            schema:
              $ref: '#/components/schemas/Body_Selection'
        required: true
      responses:
        default:
          content: {}
      security:
      - default: []
      x-codegen-request-body-name: body
      x-auth-type: Application & Application User
      x-throttling-tier: null
      tags:
      - Body Selections
      summary: PUT body selections body selection id
      x-summary-source: derived
    delete:
      description: Deletes all files and information on the existing body_selection with given body_selectionId identifier.
      operationId: DELETE_body_selections-body_selectionId
      parameters:
      - name: body_selectionId
        in: path
        description: Pre-configured body_selection ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        default:
          content: {}
      security:
      - default: []
      x-auth-type: null
      x-throttling-tier: null
      tags:
      - Body Selections
      summary: DELETE body selections body selection id
      x-summary-source: derived
    servers:
    - url: https://api.eumetsat.int/epcs/0.1.0
    - url: http://api.eumetsat.int/epcs/0.1.0
components:
  schemas:
    Body_Selection:
      required:
      - body_selection
      - id
      - name
      type: object
      properties:
        id:
          type: string
          example: body_selection_1
        name:
          type: string
          example: Body Selection 1
        description:
          type: string
          example: Body segments selection
        body_selection:
          type: array
          example: '[1,2,4,7]'
        product:
          type: string
          example: FCIL1FDHSI
      description: Body segments selection
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://api.eumetsat.int/authorize
          scopes: {}
x-refined-from:
- eumetsat-data-tailor-openapi.json
- eumetsat-data-tailor-openapi.yml
