name: EUMETSAT MCP server (candidate)
type: MCPServer
generated: '2026-10-18'
method: derived
source: openapi/
status: candidate
description: No official EUMETSAT MCP server was found (web search 2026-10-18 returned
  nothing; https://api.eumetsat.int/mcp -> 404). This is a candidate tool list derived
  from EUMETSAT Data Store, Data Tailor and User Info OpenAPI operations.
deployment:
  mode: none
  auth: oauth
  verified: derived
auth_note: The EUMETSAT gateway specs declare an OAuth2 security scheme (implicit
  flow, authorizationUrl https://api.eumetsat.int/authorize); any server built on
  them would need EUMETSAT account credentials.
