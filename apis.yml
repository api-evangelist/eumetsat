aid: eumetsat

name: EUMETSAT

description: EUMETSAT, the European Organisation for the Exploitation of Meteorological Satellites, is an intergovernmental organisation that
  operates Europe's meteorological satellites (Meteosat, Metop, MTG, Metop-SG) and Copernicus missions. Through its User Portal and Data Store
  it provides satellite data to users via web interfaces and REST APIs on api.eumetsat.int (browse, search, download, Data Tailor customisation,
  API key and token management), plus the EUMDAC Python data access client.

